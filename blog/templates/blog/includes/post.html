{% load static %}

<li>
    <article class="post">
        <a href="{% url 'post-detail-page' slug=post.slug %}">
            <img src="{% static "blog/images/"|add:post.image %}" alt="{{ post.title }}" height="200" width="300"/>
            <div class="post__content">
                <h3>{{ post.title }}</h3>
                <p>L{{ post.excerpt }}</p>
            </div>
        </a>
    </article>
</li>
